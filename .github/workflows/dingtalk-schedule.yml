name: DingTalk Scheduled Notify

on:
  schedule:
    - cron: '0 9 * * 2,4,5'   # 周二、四、五 UTC 9:00 = 北京时间 17:00
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send DingTalk message
        env:
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          export TZ=Asia/Shanghai
          TIMESTAMP=$(date +%s%3N)
          SIGN=$(printf '%s\n%s' "$TIMESTAMP" "$DINGTALK_SECRET" \
            | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary \
            | openssl base64 \
            | python3 -c "import sys, urllib.parse; print(urllib.parse.quote_plus(sys.stdin.read().strip()))")

          WEBHOOK="https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_ACCESS_TOKEN}&timestamp=${TIMESTAMP}&sign=${SIGN}"

          RESPONSE=$(curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"定时通知\",
                \"text\": \"@所有人 两位小伙伴，今天下班前或者明天上午发下手头的工作内容和进度。已提测的确认下测试排期和进度\"
              },
              \"at\": {
                \"isAtAll\": true
              }
            }")

          echo "DingTalk response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"errcode":0' || exit 1
